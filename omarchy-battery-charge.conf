# Let members of "wheel" set battery charge thresholds and charge behaviour
# without root, so a desktop widget can drive them directly.
#
# Scope is deliberately narrow: only these three attributes, only on a real
# battery. Nothing else under /sys becomes group-writable.
#
# Installed by the Omarchy battery widget. Remove this file to revert.

z /sys/class/power_supply/BAT*/charge_control_end_threshold   0664 root wheel - -
z /sys/class/power_supply/BAT*/charge_control_start_threshold 0664 root wheel - -
z /sys/class/power_supply/BAT*/charge_behaviour               0664 root wheel - -
