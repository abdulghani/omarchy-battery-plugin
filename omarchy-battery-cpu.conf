# Let members of "wheel" cap CPU speed without root, so the battery widget's
# Throttle CPU switch can drive it directly.
#
# Scope is deliberately narrow: only each CPU frequency policy's upper speed
# limit. Governors, energy preferences, and turbo stay root-only.
#
# Installed by the Omarchy battery widget. Remove this file to revert.

z /sys/devices/system/cpu/cpufreq/policy*/scaling_max_freq 0664 root wheel - -
